<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>VISIONTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#000;color:#fff;overflow:hidden;height:100vh;width:100vw}
#player{width:100%;height:100%;position:relative}
#player video{width:100%;height:100%;object-fit:contain;background:#000}
#sideMenu{position:absolute;left:0;top:0;width:380px;height:100%;background:rgba(0,0,0,0.85);overflow-y:auto;z-index:10;border-right:1px solid #333;padding-top:10px}
.canal{display:flex;align-items:center;gap:12px;padding:10px 12px;font-size:16px;cursor:pointer;border:2px solid transparent}
.canal:focus{outline:none;border:2px solid #1a6aff;background:#1a6aff}
.c-logo{width:60px;height:34px;background:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.c-logo img{width:90%;height:90%;object-fit:contain}
.canal.activo{background:#1a6aff}
#bottom{position:absolute;left:400px;bottom:20px;right:20px;display:flex;gap:15px;align-items:flex-end;z-index:10}
.logo-grande{width:200px;height:120px;background:#fff;border:3px solid #a020f0;border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo-grande img{width:90%;height:90%;object-fit:contain}
.barra-azul{background:linear-gradient(90deg,#1a3bb8,#2a5bd8);padding:8px 12px;border-radius:4px;display:flex;align-items:center;gap:10px;min-width:400px}
.mini-logo{width:65px;height:32px;background:#fff;border-radius:3px;display:flex;align-items:center;justify-content:center}
.mini-logo img{width:90%;height:90%;object-fit:contain}
@media (max-width:800px){#sideMenu{width:100%} #bottom{left:10px}}
</style>
</head>
<body>
<div id="player">
  <video id="video" autoplay muted playsinline></video>
  <div id="sideMenu" tabindex="0"></div>
  <div id="bottom">
    <div class="logo-grande"><img id="bigLogo"></div>
    <div class="barra-azul"><div class="mini-logo"><img id="miniLogo"></div><span id="chanName">VISIONTV</span><span id="hora" style="margin-left:auto"></span></div>
  </div>
</div>
<script>
let CANALES=[]; let sel=0; let hls=null;
async function cargar(){
// CAMBIO CLAVE: ya no usa 192.168.1.2, usa el canales.json de tu GitHub
  let r = await fetch('./canales.json');
  CANALES = await r.json();
  render(); update();
}
function play(url){
  let v=document.getElementById('video');
  if(hls){hls.destroy(); hls=null}
  if(Hls.isSupported()){hls=new Hls(); hls.loadSource(url); hls.attachMedia(v); hls.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}
  else{v.src=url; v.play();}
}
function render(){
  let m=document.getElementById('sideMenu'); m.innerHTML="";
  CANALES.forEach((c,i)=>{
    let d=document.createElement('div');
    d.className='canal'+(i==sel?' activo':''); d.tabIndex=0;
    d.innerHTML=`<div class="c-logo"><img src="${c.logo}" onerror="this.style.display='none'"></div><span>${c.nombre}</span>`;
    d.onclick=()=>{sel=i; update();}
    d.onfocus=()=>{sel=i; render();}
    m.appendChild(d);
  });
  let items=m.querySelectorAll('.canal');
  if(items[sel]) items[sel].focus();
}
function update(){
  let c=CANALES[sel]; if(!c) return;
  document.getElementById('chanName').innerText=c.nombre;
  document.getElementById('bigLogo').src=c.logo;
  document.getElementById('miniLogo').src=c.logo;
  play(c.url);
}
// Control para Firestick ONN / Android TV / Teclado
document.addEventListener('keydown',e=>{
  if(e.key=="ArrowDown"){sel=(sel+1)%CANALES.length; render(); e.preventDefault()}
  if(e.key=="ArrowUp"){sel=(sel-1+CANALES.length)%CANALES.length; render(); e.preventDefault()}
  if(e.key=="Enter"){update();}
});
setInterval(()=>{document.getElementById('hora').innerText=new Date().toLocaleTimeString()},1000);
cargar();
</script>
</body>
</html>
