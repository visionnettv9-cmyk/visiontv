<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PRUEBA VISIONTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body style="background:black;color:white;font-family:Arial;text-align:center">
<h2>PRUEBA - Si se ve NASA, tu web ya jala</h2>
<video id="v" controls autoplay muted style="width:90%;max-width:800px;background:#000"></video>
<br><br>
<button onclick="play('https://nasa.nasawestvalley.com/nasatv-all/nasatv-all.m3u8')">NASA TV</button>
<button onclick="play('https://dwamdstream102.akamaized.net/hls/live/2015525/dwstream102/stream04/streamPlaylist.m3u8')">DW Español</button>
<button onclick="play('https://ztvapp.online/live/ST526GHT82/ST526GHT82/18660.m3u8')">TU HBO (solo audio)</button>

<script>
function play(url){
 let video=document.getElementById('v');
 if(Hls.isSupported()){
  let hls=new Hls();
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED,function(){video.play();});
 } else { video.src=url; video.play(); }
}
play('https://nasa.nasawestvalley.com/nasatv-all/nasatv-all.m3u8');
</script>
</body>
</html>
