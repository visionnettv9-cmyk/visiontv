<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Español - VISIONTV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a0a0a;color:#fff;overflow:hidden}
.guia{width:100vw;height:100vh;background:radial-gradient(ellipse at center,#1a1a1a 0%,#000 100%);display:flex;flex-direction:column}
.preview-area{height:42vh;display:flex;padding:15px;gap:15px;flex-shrink:0}
.video-preview{width:32%;background:#000;border:1px solid #333;position:relative}
.video-preview video{width:100%;height:100%;object-fit:cover}
.info-top{flex:1;padding:10px;position:relative}
.info-top h2{font-size:26px;font-weight:800}
.logo-box{position:absolute;right:20px;top:15px;width:120px;height:120px;background:#fff;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:3px solid #a000ff}
.logo-box img{width:90%;height:90%;object-fit:contain}
.timeline{display:flex;background:#b30000;height:30px;align-items:center;font-size:14px;font-weight:700;flex-shrink:0}
.timeline div{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.2)}
.lista{flex:1;overflow-y:auto;background:rgba(20,20,20,.9)}
.canal{display:flex;align-items:center;padding:12px 15px;border-bottom:1px solid #222;cursor:pointer;gap:12px}
.canal.activo{background:#0066ff;color:#fff}
.c-logo{width:50px;height:32px;background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0}
.c-logo img{width:100%;height:100%;object-fit:contain;padding:2px}
.c-name{width:160px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-prog{flex:1;color:#aaa;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canal.activo.c-prog{color:#fff}
#player{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;display:none;z-index:100}
#player video{width:100%;height:100%}
#infobar{position:absolute;bottom:30px;left:20px;right:20px;display:none;align-items:center;gap:15px;z-index:101}
.infologo{width:140px;height:85px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden;border:4px solid #ff00ff;flex-shrink:0}
.infologo img{width:90%;height:90%;object-fit:contain}
.bar-info{flex:1;background:linear-gradient(90deg,#0000ff,#ff00ff);padding:12px 15px;border-radius:8px;display:flex;justify-content:space-between;align-items:center}
#sideMenu{position:absolute;left:0;top:0;width:380px;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:none;padding:0;overflow-y:auto;border-right:1px solid rgba(255,255,255,0.1);z-index:102}
.canal{background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.08)}
.canal.activo{background:rgba(0,102,255,0.85)!important;backdrop-filter:blur(5px)}
#infobar{background:transparent;bottom:15px}
.bar-info{background:linear-gradient(90deg,rgba(0,0,255,0.75),rgba(255,0,255,0.75));backdrop-filter:blur(10px)}
</style>
</head>
<body>
<div class="guia" id="guia">
  <div class="preview-area">
    <div class="video-preview"><video id="prevVideo" autoplay muted></video></div>
    <div class="info-top">
      <h2 id="chName">Cargando...</h2>
      <p style="color:#888;margin-top:6px;font-size:14px" id="chDesc">VISIONTV • Sin información</p>
      <div class="logo-box"><img id="logoBox" src=""></div>
      <p style="position:absolute;bottom:10px;color:#666;font-size:12px">Presiona ENTER para pantalla completa | Flechas ↑↓ para cambiar</p>
    </div>
  </div>
  <div class="timeline"><div>Hoy</div><div id="t1">01:30 AM</div><div id="t2">02:00 AM</div><div id="t3">02:30 AM</div></div>
  <div class="lista" id="listaCanales"></div>
</div>

<div id="player">
  <video id="fullVideo" autoplay controls></video>
  <div id="infobar">
    <div class="infologo"><img id="infoLogo" src=""></div>
    <div class="bar-info"><div><div id="infoName" style="font-weight:800">Canal</div><small>VISIONTV • HD • Español</small></div><span id="hora" style="font-weight:700"></span></div>
  </div>
  <div id="sideMenu"><div id="sideList"></div></div>
</div>

<script>
// TUS MISMOS CANALES DE INDEX.HTML
const CANALES = {
 "TV-Español": [
  {nombre:"Azteca 7", logo:"https://upload.wikimedia.org/wikipedia/commons/2/2d/Tv_Azteca_7_logo.png", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {nombre:"Canal 5", logo:"https://upload.wikimedia.org/wikipedia/commons/4/48/Canal_5_logo.png", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {nombre:"Las Estrellas", logo:"https://upload.wikimedia.org/wikipedia/commons/6/6b/Las_Estrellas_logo.png", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {nombre:"TUDN", logo:"https://upload.wikimedia.org/wikipedia/commons/3/32/TUDN_logo.png", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 ],
 "Live TV - Sport": [
  {nombre:"ESPN", logo:"https://upload.wikimedia.org/wikipedia/commons/2/2f/ESPN_wordmark.svg", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {nombre:"Fox Sports", logo:"https://upload.wikimedia.org/wikipedia/commons/9/94/Fox_Sports_logo.svg", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 ],
 "Peliculas": [
  {nombre:"Avengers Endgame", logo:"https://image.tmdb.org/t/p/w300/or06FN3Dka5tukK1e9sl16pB3iy.jpg", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
  {nombre:"Mario Bros", logo:"https://image.tmdb.org/t/p/w300/qNBAXBIQlnY5Db4Cqe2zLxvUW1x.jpg", url:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},
 ]
};

// JUNTAMOS TODO PARA LA GUIA
let canales = [...CANALES["TV-Español"],...CANALES["Live TV - Sport"],...CANALES["Peliculas"]];
let sel=0,state=0;

function playHLS(video, url){
 if(Hls.isSupported()){ let hls=new Hls(); hls.loadSource(url); hls.attachMedia(video); }
 else { video.src=url; }
}

function render(){
 let lista=document.getElementById('listaCanales');
 lista.innerHTML="";
 canales.forEach((c,i)=>{
  let d=document.createElement('div');
  d.className='canal'+(i==sel?' activo':'');
  d.innerHTML=`<div class="c-logo"><img src="${c.logo}" onerror="this.src='https://via.placeholder.com/80x50?text=TV'"></div><div class="c-name">${c.nombre}</div><div class="c-prog">No hay información disponible • HD</div>`;
  d.onclick=()=>{ sel=i; render(); preview(); enterGuia(); };
  lista.appendChild(d);
 });
 document.getElementById('sideList').innerHTML=document.getElementById('listaCanales').innerHTML;
}
function preview(){
 if(!canales[sel])return;
 let c=canales[sel];
 document.getElementById('chName').innerText=c.nombre;
 document.getElementById('logoBox').src=c.logo;
 playHLS(document.getElementById('prevVideo'), c.url);
}
function enterGuia(){
 let c=canales[sel];
 if(state==0){
  document.getElementById('guia').style.display='none';
  document.getElementById('player').style.display='block';
  document.getElementById('infoName').innerText=c.nombre;
  document.getElementById('infoLogo').src=c.logo;
  playHLS(document.getElementById('fullVideo'), c.url);
  state=1;
 } else if(state==1){
  document.getElementById('infobar').style.display='flex';
  state=2;
 } else if(state==2){
  document.getElementById('sideMenu').style.display='block';
  state=3;
 }
}
document.addEventListener('keydown',e=>{
 if(e.key=='Enter') enterGuia();
 if(e.key=='Escape'){
  if(state==3){document.getElementById('sideMenu').style.display='none';state=2;return}
  if(state==2){document.getElementById('infobar').style.display='none';state=1;return}
  if(state==1){document.getElementById('player').style.display='none';document.getElementById('guia').style.display='flex';state=0;preview();return}
 }
 if(e.key=='ArrowDown'&&state!=1){ sel=(sel+1)%canales.length; render(); preview(); }
 if(e.key=='ArrowUp'&&state!=1){ sel=(sel-1+canales.length)%canales.length; render(); preview(); }
});
setInterval(()=>{ let h=document.getElementById('hora'); if(h) h.innerText=new Date().toLocaleString(); let d=new Date(); document.getElementById('t1').innerText=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); },1000);
render(); preview();
</script>
</body>
</html>
