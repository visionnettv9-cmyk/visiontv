<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Español - VISIONTV</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff;overflow:hidden}.guia{width:100vw;height:100vh;background:radial-gradient(ellipse at center,#1a1a1a 0%,#000 100%)}.preview-area{height:42vh;display:flex;padding:15px;gap:15px}.video-preview{width:32%;background:#000;border:1px solid #333}.video-preview video{width:100%;height:100%;object-fit:cover}.info-top{flex:1;padding:10px;position:relative}.info-top h2{font-size:24px}.logo-box{position:absolute;right:20px;top:20px;width:110px;height:110px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;font-size:38px;border:3px solid #a000ff}.timeline{display:flex;background:#b30000;height:30px;align-items:center;font-size:14px}.timeline div{flex:1;text-align:center;border-right:1px solid rgba(255,255,255,.2)}.lista{height:50vh;overflow-y:auto;background:rgba(20,20,20,.8)}.canal{display:flex;align-items:center;padding:10px 15px;border-bottom:1px solid #222;cursor:pointer}.canal.activo{background:#0066ff}.c{width:42px;height:28px;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;border-radius:4px;margin-right:12px;font-weight:bold;font-size:14px}#player{position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;display:none;z-index:100}#player video{width:100%;height:100%}#infobar{position:absolute;bottom:25px;left:20px;right:20px;display:none;align-items:center;gap:15px}#infobar.logo-big{width:130px;height:80px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#000;font-size:40px;font-weight:bold;border:4px solid #ff00ff}.bar-info{flex:1;background:linear-gradient(90deg,#0000ff,#ff00ff);padding:10px 15px;border-radius:6px}#sideMenu{position:absolute;left:0;top:0;width:340px;height:100%;background:rgba(0,0,0,.96);display:none;padding:10px;overflow-y:auto;border-right:1px solid #333}</style></head><body><div class="guia" id="guia"><div class="preview-area"><div class="video-preview"><video id="prevVideo" autoplay muted></video></div><div class="info-top"><h2 id="chName">Cargando...</h2><p style="color:#888;margin-top:5px">No hay información disponible</p><div class="logo-box" id="logoBox">TV</div></div></div><div class="timeline"><div>Hoy</div><div>01:30 AM</div><div>02:00 AM</div><div>02:30 AM</div></div><div class="lista" id="listaCanales"></div></div><div id="player"><video id="fullVideo" autoplay controls></video><div id="infobar"><div class="logo-big" id="infoLogo">TV</div><div class="bar-info"><div id="infoName">Canal</div><small>VISIONTV • HD</small><span style="float:right" id="hora"></span></div></div><div id="sideMenu"></div></div><script>let canales=[],sel=0,state=0;fetch('canales.json').then(r=>r.json()).then(data=>{canales=data;if(!Array.isArray(canales))canales=data.canales||[];render();preview()}).catch(()=>{canales=[{name:"Canal 5",logo:"5",src:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},{name:"Azteca 7",logo:"7",src:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},{name:"ESPN",logo:"ESPN",src:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"},{name:"Fox Sports",logo:"FOX",src:"https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8"}];render();preview()});const lista=document.getElementById('listaCanales');function render(){lista.innerHTML="";canales.forEach((c,i)=>{let d=document.createElement('div');d.className='canal'+(i==sel?' activo':'');let lg=(c.logo||c.name||"TV").substring(0,4);d.innerHTML=`<div class="c">${lg}</div><div style="flex:1">${c.name||c.nombre}</div><div style="flex:2;color:#aaa;font-size:13px">No hay información disponible</div>`;d.onclick=()=>{sel=i;render();preview();enterGuia()};lista.appendChild(d)});document.getElementById('sideMenu').innerHTML=lista.innerHTML}function preview(){if(!canales[sel])return;let c=canales[sel];document.getElementById('chName').innerText=c.name||c.nombre;document.getElementById('logoBox').innerText=(c.logo||c.name||"TV").substring(0,4);document.getElementById('prevVideo').src=c.src||c.url||""}function enterGuia(){let c=canales[sel];if(state==0){document.getElementById('guia').style.display='none';document.getElementById('player').style.display='block';document.getElementById('fullVideo').src=c.src||c.url||"";state=1}else if(state==1){document.getElementById('infobar').style.display='flex';document.getElementById('infoLogo').innerText=(c.logo||c.name||"TV").substring(0,4);document.getElementById('infoName').innerText=c.name||c.nombre;state=2}else if(state==2){document.getElementById('sideMenu').style.display='block';state=3}}document.addEventListener('keydown',e=>{if(e.key=='Enter')enterGuia();if(e.key=='Escape'){if(state==3){document.getElementById('sideMenu').style.display='none';state=2;return}if(state==2){document.getElementById('infobar').style.display='none';state=1;return}if(state==1){document.getElementById('player').style.display='none';document.getElementById('guia').style.display='block';state=0;return}}if(e.key=='ArrowDown'&&state==0){sel=(sel+1)%canales.length;render();preview()}if(e.key=='ArrowUp'&&state==0){sel=(sel-1+canales.length)%canales.length;render();preview()}});setInterval(()=>{let h=document.getElementById('hora');if(h)h.innerText=new Date().toLocaleString()},1000);</script></body></html>
