<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISION TV - FIFA 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family: 'Arial Black', Arial, sans-serif;overflow-x:hidden}
.top{background:rgba(0,0,0,0.95);padding:12px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e50914;position:fixed;width:100%;z-index:100;top:0}
.logo{font-size:28px;font-weight:900;color:#e50914;letter-spacing:1px}
.logo span{color:#fff}
.menu{display:flex;gap:22px}
.menu a{color:#fff;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:0.5px;cursor:pointer}
.menu a.active{color:#e50914;border-bottom:2px solid #e50914;padding-bottom:3px}
.hero{height:100vh;background:linear-gradient(90deg, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.2) 100%), url('https://images.unsplash.com/photo-1489944440615-453fc2b6a9?q=80&w=2070');background-size:cover;background-position:center top;display:flex;align-items:center;padding:0 5%;position:relative}
.content{margin-top:60px;max-width:600px}
.badge{background:#e50914;color:#fff;padding:8px 16px;font-size:12px;font-weight:900;letter-spacing:1px;display:inline-block;margin-bottom:20px;box-shadow:0 4px 10px rgba(229,9,20,0.5)}
.content h1{font-size:68px;line-height:0.9;text-transform:uppercase;font-weight:900;text-shadow:3px 3px 15px rgba(0,0,0,0.8)}
.content h1 span{color:#e50914}
.content p{margin-top:18px;color:#ddd;font-size:16px;font-family:Arial, sans-serif;line-height:1.4}
.btn{margin-top:28px;background:#e50914;border:none;color:#fff;padding:16px 40px;font-weight:900;font-size:17px;border-radius:4px;cursor:pointer;box-shadow:0 5px 20px rgba(229,9,20,0.6);transition:0.2s}
.btn:hover{transform:scale(1.05);background:#ff0a16}
.zigzag{position:absolute;bottom:-1px;left:0;width:100%;height:30px;background:linear-gradient(135deg, #e50914 25%, transparent 25%) -15px 0, linear-gradient(225deg, #e50914 25%, transparent 25%) -15px 0;background-size:30px 30px;z-index:10}
.players{position:absolute;right:5%;bottom:30px;width:55%;height:90%;background:url('https://images.unsplash.com/photo-1577224682124-315f2a0a65c2?q=80&w=1000') no-repeat;background-size:contain;background-position:right bottom;opacity:0.9;mix-blend-mode:lighten}
</style>
</head>
<body>
<div class="top">
<div class="logo">VISION<span>TV</span></div>
<div class="menu">
<a class="active">HOME</a><a>EN VIVO</a><a>PELICULAS</a><a>SERIES</a><a>FIFA 2026</a>
</div>
</div>
<div class="hero">
<div class="content">
<div class="badge">FIFA WORLD CUP 2026 • MEXICO - USA - CANADA • EN VIVO</div>
<h1>TU<br><span>VISION</span><br>DEL FUTBOL</h1>
<p>El mejor contenido en un solo lugar. Optimizado para Firestick y Smart TV. Vive el Mundial como nunca.</p>
<button class="btn">▶ VER AHORA</button>
</div>
<div class="zigzag"></div>
</div>
</body>
</html>
