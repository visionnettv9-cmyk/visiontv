<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISIONTV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Arial,sans-serif}
.top{background:#000;padding:12px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e50914;position:fixed;width:100%;z-index:20;top:0}
.logo{font-size:26px;color:#e50914;font-weight:900} .logo span{color:#fff}
.btn{background:#e50914;border:none;color:#fff;padding:14px 36px;font-weight:900;border-radius:4px;cursor:pointer}
.hero{height:100vh;background:linear-gradient(90deg,#000 0%,rgba(0,0,0,0.6) 45%,rgba(0,0,0,0.1) 100%), url('./hero.jpg');background-size:cover;background-position:center;display:flex;align-items:center;padding:0 5%}
.app{height:100vh;padding-top:56px;display:flex;background:repeating-linear-gradient(115deg,#080808 0 18px,#140000 18px 20px,#000 20px 40px)}
.sidebar{width:300px;background:rgba(0,0,0,0.85);margin:15px;border:1px solid #222;border-radius:12px;padding:10px 0}
.item{padding:12px 18px;display:flex;gap:10px;cursor:pointer;font-size:15px;border-radius:6px;margin:2px 8px} .item.active,.item:hover{background:#1e5cff}
.preview{flex:1;margin:15px;background:#111;border-radius:12px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center}
.preview img{width:100%;height:100%;object-fit:cover;opacity:0.7}
.preview-text{position:absolute;font-size:38px;font-weight:900}
</style>
</head>
<body>
<div class="top"><div class="logo">VISION<span>TV</span></div><div style="font-size:12px">APP_URL: visionnettv9-cmyk.github.io/visiontv/</div></div>

<div id="home" class="hero">
<div style="max-width:500px;margin-top:60px">
<div style="background:#e50914;padding:6px 12px;display:inline-block;font-size:10px;font-weight:900;margin-bottom:15px">FIFA 2026 • EN VIVO</div>
<h1 style="font-size:62px;line-height:0.9;font-family:Arial Black">TU<br><span style="color:#e50914">VISION</span><br>DEL FUTBOL</h1>
<button class="btn" style="margin-top:20px" onclick="showApp()">▶ ENTRAR AL MENU</button>
</div>
</div>

<div id="app" class="app" style="display:none">
<div class="sidebar" id="menu"></div>
<div class="preview">
<img id="previewImg" src="./hero.jpg">
<div class="preview-text" id="previewText">TV-Español</div>
</div>
</div>

<script>
function showApp(){document.getElementById('home').style.display='none';document.getElementById('app').style.display='flex';loadMenu();}
async function loadMenu(){
 let data = await fetch('./canales.json').then(r=>r.json());
 let html='';
 data.categorias.forEach((c,i)=>{
  html+=`<div class="item ${i==0?'active':''}" onclick="selectCat(this,'${c.nombre}')"><span>${c.icon}</span> ${c.nombre}</div>`;
 });
 document.getElementById('menu').innerHTML=html;
}
function selectCat(el,nombre){
 document.querySelectorAll('.item').forEach(i=>i.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('previewText').innerText=nombre;
 // AQUI LUEGO CAMBIAS LA PORTADA SEGUN CATEGORIA:
 // document.getElementById('previewImg').src = './portadas/'+nombre+'.jpg'
}
</script>
</body>
</html>
