<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VISION TV</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:Arial, sans-serif}
.top{background:#000;padding:12px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #e50914}
.logo{font-size:26px;font-weight:900;color:#e50914}
.logo span{color:#fff}
.menu a{color:#fff;text-decoration:none;margin-left:20px;font-weight:bold;font-size:13px}
.menu a.active{color:#e50914}
.hero{height:85vh;background:linear-gradient(to bottom, rgba(0,0,0,0.2), #050505), url('https://images.unsplash.com/photo-1504304550040-94a6a7c5a5d8?q=80&w=2000');background-size:cover;background-position:center;position:relative;display:flex;align-items:center;padding:40px}
.content h2{background:#e50914;display:inline-block;padding:6px 14px;font-size:14px;margin-bottom:15px}
.content h1{font-size:52px;line-height:0.95;text-transform:uppercase}
.content h1 red{color:#e50914}
.content p{margin-top:15px;color:#ccc;max-width:400px}
.btn{margin-top:25px;background:#e50914;border:none;color:#fff;padding:14px 35px;font-weight:900;font-size:16px;border-radius:3px;cursor:pointer}
.zigzag{position:absolute;bottom:0;left:0;width:100%;height:40px;background:linear-gradient(135deg, #e50914 25%, transparent 25%) -20px 0, linear-gradient(225deg, #e50914 25%, transparent 25%) -20px 0;background-size:40px 40px}
</style>
</head>
<body>
<div class="top">
<div class="logo">VISION<span>TV</span></div>
<div class="menu">
<a class="active">HOME</a><a>EN VIVO</a><a>PELICULAS</a><a>FIFA 2026</a>
</div>
</div>
<div class="hero">
<div class="content">
<h2>FIFA WORLD CUP 2026 • MEXICO - USA - CANADA</h2>
<h1>TU<br><red>VISION</red><br>DEL FUTBOL</h1>
<p>El mejor contenido en un solo lugar. Optimizado para Firestick y Smart TV.</p>
<button class="btn">▶ VER AHORA</button>
</div>
<div class="zigzag"></div>
</div>
</body>
</html>
